<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Xochi Pocket</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header><span id="words">0 words</span><span id="status">Opening…</span></header>
  <div id="tools" role="toolbar" aria-label="Writing tools">
    <button id="undo" type="button" aria-label="Undo" disabled>↶</button>
    <button id="redo" type="button" aria-label="Redo" disabled>↷</button>
    <span class="gap"></span>
    <button id="italic" type="button" aria-label="Italic" aria-pressed="false">I</button>
    <button id="bold" type="button" aria-label="Bold" aria-pressed="false">B</button>
    <span class="gap"></span>
    <button id="spelling" type="button" aria-pressed="false">Check spelling</button>
  </div>
  <div id="page"></div>
  <script src="main.js"></script>
</body>
</html>
